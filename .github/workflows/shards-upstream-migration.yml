name: Import, rebrand, and validate Shards Agent

on:
  push:
    branches: [main]
    paths:
      - "scripts/shards_rebrand.py"
      - ".github/workflows/shards-upstream-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shards-agent-upstream-migration
  cancel-in-progress: false

jobs:
  import-and-test:
    name: Full upstream import and test gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GIT_TERMINAL_PROMPT: "0"
      HERMES_TEST_WORKERS: "4"
    steps:
      - name: Check out Shards bootstrap and migration script
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Clone complete upstream Git history
        run: git clone https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/shards-agent"

      - name: Preserve destination history and apply Shards branding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/shards-agent"
          git -C "$repo" config user.name "github-actions[bot]"
          git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repo" remote add shards "https://x-access-token:${GH_TOKEN}@github.com/Shards-foundation/shards-agent..git"
          git -C "$repo" fetch shards main

          set +e
          git -C "$repo" merge --allow-unrelated-histories --no-commit shards/main
          merge_status=$?
          set -e
          if [ "$merge_status" -gt 1 ]; then
            echo "Merge failed with status $merge_status"
            exit "$merge_status"
          fi

          conflicts="$(git -C "$repo" diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            if [ "$conflicts" != "README.md" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            # Keep upstream README as the base, then rebrand it in the next step.
            git -C "$repo" checkout --ours -- README.md
            git -C "$repo" add README.md
          fi

          python "$GITHUB_WORKSPACE/scripts/shards_rebrand.py" "$repo"
          (cd "$repo" && uv lock)
          git -C "$repo" add -A
          git -C "$repo" commit -m "feat: import Hermes Agent as Shards Agent"

      - name: Verify lockfile and Shards distribution contract
        working-directory: ${{ runner.temp }}/shards-agent
        run: |
          uv lock --check
          uv sync --locked --group dev
          uv run --locked pytest -q tests/shards/test_distribution_metadata.py
          .venv/bin/shards-agent --help >/dev/null
          .venv/bin/hermes-agent --help >/dev/null

      - name: Run complete upstream test suite
        working-directory: ${{ runner.temp }}/shards-agent
        run: scripts/run_tests.sh

      - name: Push only after the test gate succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/shards-agent" push shards HEAD:main
